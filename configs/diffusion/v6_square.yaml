name: train_diffusion_unet_hybrid_dad
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: default
pretrained_checkpoint: ???
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_dad_policy.DiffusionUnetHybridImageDADPolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape:
  - 76
  - 76
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  pretrained_student_checkpoint_path: ${pretrained_checkpoint}
  teacher_checkpoint_path: ${pretrained_checkpoint}
  load_full_student_policy: true
  latent_loss_weight: 1.0
  diffusion_loss_weight: 0.0
  diffusion_loss_input_mode: clean
  pair_loss_type: mse
  pair_huber_delta: 1.0
  lambda_pair: 1.0
  lambda_mean: 0.0
  lambda_coral: 0.0
  coral:
    eps: 1.0e-05
    unbiased: true
  projector_hidden_dim: 512
  projector_num_layers: 3
  projector_residual: false
  projector_residual_scale: 0.01
  projector_zero_init_output: false
  projector_activation: mish
  projector_input_layer_norm: false
  projector_layer_norm_every_layer: false
  projector_architecture: standard
  rgb_adapter_mode: per_view
  joint_projector_hidden_dim: null
  joint_projector_num_layers: null
  joint_projector_residual: null
  joint_projector_residual_scale: null
  joint_projector_zero_init_output: null
  joint_projector_activation: null
  joint_projector_input_layer_norm: null
  joint_projector_layer_norm_every_layer: null
  joint_projector_architecture: standard
  use_pre_spatial_adapter: false
  pre_spatial_adapter_type: conv
  pre_spatial_adapter_hidden_channels: null
  pre_spatial_adapter_kernel_size: 1
  pre_spatial_adapter_mlp_hidden_dim: null
  pre_spatial_adapter_mlp_num_layers: 2
  pre_spatial_adapter_mlp_layer_norm: true
  pre_spatial_adapter_residual: true
  pre_spatial_adapter_residual_scale: 0.03
  pre_spatial_adapter_zero_init_output: true
  pre_spatial_adapter_activation: null
  pre_spatial_adapter_norm: group
  use_fusion_projector: false
  fusion_projector_hidden_dim: 512
  fusion_projector_num_layers: 2
  use_residual_fusion_projector: false
  local_latent_loss_weight: 0.0
  global_latent_loss_weight: 1.0
  robust_latent_loss_weight: 1.0
  clean_latent_loss_weight: 0.0
  robust_latent_input_mode: shift_overlay
  input_grad_regularization_weight: 0.0
  input_grad_regularization_loss_weighted: false
  input_grad_regularization_auto_calibrate: false
  input_grad_regularization_target_ratio: 0.05
  input_grad_regularization_calibration_batches: 5
  input_grad_regularization_lambda_scale: 0.0
  input_grad_regularization_log_batches: 5
  robust_shift_pad: 0
  overlay_mode: places365
  overlay_root: ${oc.env:PLACES365_ROOT,null}
  overlay_dataset: places365_standard
  overlay_num_workers: 2
  overlay_use_val_split: false
  overlay_prob: 1.0
  overlay_alpha: 0.5
  min_overlay_alpha: 0.0
  max_overlay_alpha: 1.0
  overlay_shift: 3
  use_random_ratio_overlay: true
  share_overlay_across_views: true
  deterministic_latent_crop: false
  freeze_teacher: true
  freeze_student_encoder: false
  freeze_diffusion_model: true
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 2
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 64
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: false
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
stage2_optimizer:
  enabled: false
  student_encoder_lr: null
  adapter_lr: null
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 0
  num_epochs: 20
  gradient_accumulate_every: 1
  use_ema: false
  rollout_every: 20
  checkpoint_every: 20
  val_every: 20
  sample_every: 20
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: star
  resume: true
  mode: offline
  name: star_square_v6
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  id: null
  group: null
checkpoint:
  topk:
    monitor_key: train_mean_score
    mode: max
    k: 0
    format_str: epoch={epoch:04d}-train_mean_score={train_mean_score:.3f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
multi_run:
  run_dir: outputs/${name}_${task_name}/seed${training.seed}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
task:
  name: square_image
  shape_meta:
    obs:
      agentview_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_eef_pos:
        shape:
        - 3
      robot0_eef_quat:
        shape:
        - 4
      robot0_gripper_qpos:
        shape:
        - 2
    action:
      shape:
      - 10
  task_name: square
  dataset_type: ph
  dataset_path: ${oc.env:STAR_DATA_ROOT,datasets}/square/ph/image_abs.hdf5
  abs_action: true
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    dataset_path: ${oc.env:STAR_DATA_ROOT,datasets}/square/ph/image_abs.hdf5
    shape_meta:
      obs:
        agentview_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_gripper_qpos:
          shape:
          - 2
      action:
        shape:
        - 10
    n_train: 30
    n_train_vis: 0
    train_start_idx: 0
    n_test: 0
    n_test_vis: 0
    test_start_seed: 100000
    n_eval_easy: 30
    n_eval_easy_vis: 0
    n_eval_medium: 30
    n_eval_medium_vis: 0
    n_eval_hard: 30
    n_eval_hard_vis: 0
    eval_difficulty_start_seed: 200000
    eval_difficulty_scene_start_id: 0
    max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 400'}
    n_obs_steps: ${n_obs_steps}
    n_action_steps: ${n_action_steps}
    render_obs_key: agentview_image
    fps: 10
    crf: 22
    past_action: ${past_action_visible}
    abs_action: true
    tqdm_interval_sec: 1.0
    n_envs: 10
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    shape_meta:
      obs:
        agentview_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_gripper_qpos:
          shape:
          - 2
      action:
        shape:
        - 10
    dataset_path: ${oc.env:STAR_DATA_ROOT,datasets}/square/ph/image_abs.hdf5
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
    pad_after: ${eval:'${n_action_steps}-1'}
    n_obs_steps: ${dataset_obs_steps}
    abs_action: true
    rotation_rep: rotation_6d
    use_legacy_normalizer: false
    use_cache: false
    seed: 42
    val_ratio: 0.02
hydra:
  run:
    dir: outputs/${name}_${task_name}/seed${training.seed}
